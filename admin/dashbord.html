<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tableau de bord | E.M.A</title>
    <link rel="stylesheet" href="admin.css">
    <script src="admin.js" defer></script>
  </head>
  <body data-admin-page="dashboard">
    <header class="admin-header"><div class="admin-header-inner">
      <a class="admin-brand" href="dashbord.html">E.M.A Administration</a>
      <nav class="admin-nav">
        <a aria-current="page" href="dashbord.html">Vue d'ensemble</a><a href="commandes.html">Commandes</a>
        <a href="plats.html">Plats</a><a href="stocks.html">Disponibilité</a><a href="rapports.html">Rapports</a>
      </nav><button id="logout-button" type="button">Déconnexion</button>
    </div></header>
    <main><h1>Tableau de bord</h1><p id="admin-message" class="admin-message" role="status"></p>
      <section class="admin-stats">
        <article class="admin-card admin-stat">Commandes<strong id="stats-orders">—</strong></article>
        <article class="admin-card admin-stat">Chiffre d'affaires enregistré<strong id="stats-revenue">—</strong></article>
        <article class="admin-card admin-stat">En attente<strong id="stats-pending">—</strong></article>
        <article class="admin-card admin-stat">Livrées<strong id="stats-delivered">—</strong></article>
      </section>
      <section class="admin-card"><h2>Dernières commandes</h2><div class="admin-table-wrap"><table>
        <thead><tr><th>Référence</th><th>Client</th><th>Total</th><th>Paiement</th><th>Date</th><th>Statut</th><th>Détail</th></tr></thead>
        <tbody id="orders-table"></tbody>
      </table></div></section>
    </main>
  </body>
</html>
